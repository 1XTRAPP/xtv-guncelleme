<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://jsdelivr.net"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: contain; }
    #durum { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 5px 10px; font-size: 12px; z-index: 99; }
  </style>
</head>
<body>
  <div id="durum">Yükleniyor...</div>
  <video id="video" controls autoplay muted playsinline></video>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const streamUrl = urlParams.get('url');
    const video = document.getElementById('video');
    const durum = document.getElementById('durum');

    if (!streamUrl) {
      durum.innerText = "Hata: Yayın linki gelmedi!";
    } else if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(streamUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function() {
        durum.style.display = "none";
        video.muted = false;
        video.play();
      });
      hls.on(Hls.Events.ERROR, function(event, data) {
        if (data.fatal) {
          durum.innerText = "Yayın Hatası: " + data.details;
        }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = streamUrl;
      video.addEventListener('loadedmetadata', function() {
        durum.style.display = "none";
        video.play();
      });
    }
  </script>
</body>
</html>
